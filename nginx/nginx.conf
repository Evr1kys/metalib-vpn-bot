events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$host\$request_uri; }
    }

    # metalib.xyz - Short VPN Key URLs
    server {
        listen 443 ssl;
        http2 on;
        server_name metalib.xyz www.metalib.xyz;

        ssl_certificate /etc/nginx/ssl/metalib.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/metalib.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location ~ "^/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
            set \$vpn_id \$1;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host/api/v1/vpn/key/\$vpn_id/page;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/ {
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location / { return 302 https://t.me/metalibvpn_bot; }
    }

    # vpn.metalib.xyz - PUBLIC Mini App & API
    server {
        listen 443 ssl;
        http2 on;
        server_name vpn.metalib.xyz;

        ssl_certificate /etc/nginx/ssl/vpn.metalib.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/vpn.metalib.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Telegram Mini App
        location /app/ {
            alias /var/www/miniapp/;
            index index.html;
            try_files \$uri \$uri/ /var/www/miniapp/index.html;
            add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;
            add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org https://t.me" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location = /app { return 301 /app/; }

        # Miniapp API rewrites (redirect to /telegram/ prefix)
        location /api/v1/subscription/ {
            rewrite ^/api/v1/subscription/(.*)$ /api/v1/telegram/subscription/\$1 last;
        }
        location /api/v1/referrals/ {
            rewrite ^/api/v1/referrals/(.*)$ /api/v1/telegram/referrals/\$1 last;
        }
        location /api/v1/devices {
            rewrite ^/api/v1/devices(.*)$ /api/v1/telegram/devices\$1 last;
        }
        location /api/v1/servers {
            rewrite ^/api/v1/servers(.*)$ /api/v1/telegram/servers\$1 last;
        }
        location = /api/v1/plans {
            rewrite ^/api/v1/plans$ /api/v1/telegram/plans last;
        }

        # Public API
        location /api/v1/telegram/ {
            limit_req zone=api_limit burst=20 nodelay;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/v1/subscriptions/ {
            limit_req zone=api_limit burst=20 nodelay;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/v1/vpn/ {
            limit_req zone=api_limit burst=10 nodelay;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/v1/webhooks/ {
            limit_req zone=webhook_limit burst=10 nodelay;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/v1/health {
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
        }

        root /var/www/website;
        index index.html;

        location / {
            try_files \$uri \$uri.html \$uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # panel.metalib.xyz - PRIVATE Admin (keep secret!)
    server {
        listen 443 ssl;
        http2 on;
        server_name panel.metalib.xyz;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api/v1/auth/ {
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            set \$backend_host backend:8000;
            proxy_pass http://\$backend_host;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /admin/ {
            alias /var/www/admin/;
            index index.html;
            try_files \$uri \$uri/ \$uri/index.html /admin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location /admin/_next/ {
            alias /var/www/admin/_next/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        location = /admin { return 301 /admin/; }
        
        location /dashboard/ {
            alias /var/www/admin/dashboard/;
            index index.html;
            try_files \$uri \$uri/ \$uri/index.html /var/www/admin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        
        location /login {
            alias /var/www/admin/login/;
            index index.html;
            try_files \$uri \$uri/ /var/www/admin/login/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        
        location = / { return 301 /admin/; }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
